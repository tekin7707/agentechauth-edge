server {
    listen 80;
    server_name cwisely.com www.cwisely.com api.cwisely.com opapi.cwisely.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.cwisely.com;

    ssl_certificate /etc/nginx/certs/cwisely.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cwisely.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://appleid.cdn-apple.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self' https://accounts.google.com https://challenges.cloudflare.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'self'" always;

    return 301 https://cwisely.com$request_uri;
}

server {
    listen 443 ssl;
    server_name cwisely.com;

    ssl_certificate /etc/nginx/certs/cwisely.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cwisely.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    resolver 127.0.0.11 ipv6=off valid=10s;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://appleid.cdn-apple.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self' https://accounts.google.com https://challenges.cloudflare.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'self'" always;

    # 10 MiB dosya + multipart sınır bilgisi için taşıma payı.
    client_max_body_size 11m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /healthz {
        set $cwisely_api_upstream http://cwisely_api:3000;
        proxy_pass $cwisely_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /api/opportunities {
        set $cwisely_opapi_upstream http://cwisely_opapi:3000;
        proxy_pass $cwisely_opapi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location ^~ /api/opportunities/ {
        set $cwisely_opapi_upstream http://cwisely_opapi:3000;
        proxy_pass $cwisely_opapi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location ^~ /v1/ {
        set $cwisely_api_upstream http://cwisely_api:3000;
        proxy_pass $cwisely_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location ^~ /api/ {
        set $cwisely_api_upstream http://cwisely_api:3000;
        proxy_pass $cwisely_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        set $cwisely_web_upstream http://cwisely_web:80;
        proxy_pass $cwisely_web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

